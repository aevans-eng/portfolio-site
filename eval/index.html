<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Image triage</title>
<style>
:root{--bg:#f4f1ec;--card:#fffdf9;--ink:#16160f;--mid:#54544c;--light:#8b8b82;
--green:#4a6741;--amber:#a9701c;--red:#a33d2d;--rule:rgba(22,22,15,.13);--hair:rgba(22,22,15,.07);
--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);
 padding-bottom:env(safe-area-inset-bottom)}
img,video{display:block;max-width:100%}
header{position:sticky;top:0;z-index:50;background:rgba(244,241,236,.97);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--rule);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1600px;margin:0 auto}
h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.counts{display:flex;gap:5px;font-family:var(--mono);font-size:12px}
.pill{padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--card);white-space:nowrap}
.pill.a{color:var(--green);border-color:rgba(74,103,65,.35)}
.pill.c{color:var(--amber);border-color:rgba(169,112,28,.35)}
.pill.r{color:var(--red);border-color:rgba(163,61,45,.35)}
.pill.u{color:var(--light)}
.spacer{flex:1}
.saved{font-size:11px;color:var(--green);font-family:var(--mono);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--mid);
 padding:8px 13px;border-radius:5px;min-height:38px}
button:active{transform:scale(.97)}
button.pri{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.filters{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.filters button{padding:7px 11px;font-size:13px;white-space:nowrap}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1600px;margin:0 auto;padding:14px;display:grid;
 grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden;
 display:flex;flex-direction:column}
.card.done{border-color:rgba(74,103,65,.45)}
.media{background:#eceae4;height:240px;display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative}
.media img{max-height:240px;width:auto;object-fit:contain;cursor:zoom-in}
.media video{max-height:240px;width:100%;background:#111}
.vbadge{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-family:var(--mono);
 font-size:9px;letter-spacing:.1em;padding:3px 7px;border-radius:3px;pointer-events:none}
.meta{padding:9px 12px 5px;display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--hair)}
.cid{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--green)}
.fn{font-family:var(--mono);font-size:10.5px;color:var(--mid);word-break:break-all;flex:1}
.why{padding:0 12px 8px;font-size:11.5px;color:var(--light);font-style:italic}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 12px 8px}
.grades button{font-family:var(--mono);font-weight:700;font-size:13px;padding:0;min-height:46px}
.grades button[data-g=A].on{background:var(--green);color:#fff;border-color:var(--green)}
.grades button[data-g=C].on{background:var(--amber);color:#fff;border-color:var(--amber)}
.grades button[data-g=R].on{background:var(--red);color:#fff;border-color:var(--red)}
.note{width:calc(100% - 24px);margin:0 12px 12px;padding:9px;border:1px solid var(--rule);
 border-radius:5px;font:13px var(--mono);background:#fff;color:var(--ink)}
.note:focus{outline:none;border-color:var(--green)}
.sec{grid-column:1/-1;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;
 text-transform:uppercase;color:var(--mid);border-bottom:1px solid var(--ink);padding-bottom:8px;margin-top:10px}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;
 align-items:center;justify-content:center;cursor:zoom-out;padding:16px}
#lb.on{display:flex}
#lb img{max-width:97vw;max-height:94vh;width:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
 background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;font-size:13.5px;opacity:0;
 transition:opacity .25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.hint{font-size:11.5px;color:var(--light)}
@media(max-width:600px){
  main{padding:10px;gap:10px;grid-template-columns:1fr}
  .media,.media img,.media video{height:auto;max-height:300px}
  .media{min-height:180px}
  h1{font-size:15px}
  .hint{display:none}
}
</style></head><body>

<header><div class="hrow">
  <h1>Image triage</h1>
  <div class="counts">
    <span class="pill a">A <b id="cA">0</b></span>
    <span class="pill c">C <b id="cC">0</b></span>
    <span class="pill r">R <b id="cR">0</b></span>
    <span class="pill u">left <b id="cU">0</b></span>
  </div>
  <span class="saved" id="saved">saved</span>
  <span class="spacer"></span>
  <div class="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="todo">Ungraded</button>
    <button data-f="A">A</button><button data-f="C">C</button><button data-f="R">R</button>
  </div>
  <span class="hint">Hover a card, press A / C / R</span>
  <button id="reset">Reset</button>
  <button id="send" class="pri">Send results</button>
</div></header>

<main id="grid"></main>
<div id="lb"></div><div id="toast"></div>

const KEY = 'aaron-triage-v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
ITEMS.forEach(it=>{ if(!state[it.id]) state[it.id] = {g: it.g, note: ''}; });

const grid = document.getElementById('grid');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state)); counts();
  const s=document.getElementById('saved'); s.classList.add('on');
  clearTimeout(s._t); s._t=setTimeout(()=>s.classList.remove('on'),1200);
}
function counts(){
  let a=0,c=0,r=0;
  ITEMS.forEach(i=>{const g=state[i.id].g; if(g==='A')a++;else if(g==='C')c++;else if(g==='R')r++;});
  cA.textContent=a; cC.textContent=c; cR.textContent=r; cU.textContent=ITEMS.length-a-c-r;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function render(filter='all'){
  grid.innerHTML=''; let proj=null;
  ITEMS.forEach(it=>{
    const g = state[it.id].g;
    if(filter==='todo' && g) return;
    if(['A','C','R'].includes(filter) && g!==filter) return;
    if(it.proj!==proj){ proj=it.proj;
      const h=document.createElement('div'); h.className='sec'; h.textContent=proj; grid.appendChild(h); }
    const el=document.createElement('article');
    el.className='card'+(g?' done':''); el.dataset.id=it.id;
    const media = it.video
      ? '<video src="'+it.src+'" controls preload="metadata" playsinline muted loop></video><span class="vbadge">VIDEO</span>'
      : '<img src="'+it.src+'" alt="'+esc(it.file)+'" loading="lazy">';
    el.innerHTML =
      '<div class="media">'+media+'</div>'+
      '<div class="meta"><span class="cid">'+it.id+'</span><span class="fn">'+esc(it.file)+'</span></div>'+
      (it.why? '<div class="why">'+esc(it.why)+'</div>' : '<div class="why"></div>')+
      '<div class="grades">'+
        '<button data-g="A" class="'+(g==='A'?'on':'')+'">A use</button>'+
        '<button data-g="C" class="'+(g==='C'?'on':'')+'">C crop</button>'+
        '<button data-g="R" class="'+(g==='R'?'on':'')+'">R drop</button>'+
      '</div>'+
      '<input class="note" placeholder="note - e.g. crop to the dial face" value="'+esc(state[it.id].note||'')+'">';
    grid.appendChild(el);
  });
  counts();
}
function setGrade(id, g){
  state[id].g = (state[id].g===g) ? '' : g;
  save();
  const card=[...grid.querySelectorAll('.card')].find(c=>c.dataset.id===id);
  if(card){ card.classList.toggle('done', !!state[id].g);
    card.querySelectorAll('.grades button').forEach(b=>b.classList.toggle('on', b.dataset.g===state[id].g)); }
}
grid.addEventListener('click', e=>{
  const b = e.target.closest('.grades button');
  if(b){ setGrade(b.closest('.card').dataset.id, b.dataset.g); return; }
  const img = e.target.closest('.media img');
  if(img){ const lb=document.getElementById('lb');
    lb.innerHTML='<img src="'+img.src+'">'; lb.classList.add('on'); }
});
grid.addEventListener('input', e=>{
  if(e.target.classList.contains('note')){
    state[e.target.closest('.card').dataset.id].note = e.target.value; save(); }
});
document.getElementById('lb').addEventListener('click', e=>e.currentTarget.classList.remove('on'));
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.getElementById('lb').classList.remove('on');
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toUpperCase(); if(!['A','C','R'].includes(k)) return;
  const card = document.querySelector('.card:hover');
  if(card){ e.preventDefault(); setGrade(card.dataset.id, k); }
});
document.querySelectorAll('.filters button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); render(b.dataset.f); window.scrollTo(0,0);
  });
});
function results(){
  let out='# Image triage results\n', proj=null;
  ITEMS.forEach(it=>{
    if(it.proj!==proj){ proj=it.proj; out+='\n## '+proj+'\n\n| # | File | Grade | Note |\n|---|---|---|---|\n'; }
    const s=state[it.id];
    out+='| '+it.id+' | '+it.file+' | '+(s.g||'-')+' | '+(s.note||'')+' |\n';
  });
  let a=0,c=0,r=0;
  ITEMS.forEach(i=>{const g=state[i.id].g; if(g==='A')a++;else if(g==='C')c++;else if(g==='R')r++;});
  out+='\n**Totals:** A '+a+' | C '+c+' | R '+r+' | ungraded '+(ITEMS.length-a-c-r)+'\n';
  return out;
}
document.getElementById('send').addEventListener('click', async ()=>{
  const text = results();
  if(navigator.share){
    try{ await navigator.share({title:'Image triage results', text:text}); return; }catch(err){}
  }
  try{ await navigator.clipboard.writeText(text); toast('Copied - paste it to Claude'); return; }catch(err){}
  const blob=new Blob([text],{type:'text/markdown'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='triage-results.md'; a.click(); toast('Downloaded triage-results.md');
});
document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('Clear all grades and return to the proposed ones?')) return;
  state={}; ITEMS.forEach(it=>state[it.id]={g:it.g,note:''}); save(); render('all'); toast('Reset to proposals');
});
render('all');
</script></body></html>
